name: Digital Banking API Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install root dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Build frontend
      run: cd frontend && npm ci && npm run build
      
    - name: Run E2E Tests
      run: npm run test:e2e
      
    - name: Install and Run Auth Service Tests
      run: cd backend/auth-service && npm ci && npm run test

    - name: Install and Run Transaction Service Tests
      run: cd backend/transaction-service && npm ci && npm run test
