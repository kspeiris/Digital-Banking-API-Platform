openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: API for retrieving, reading, and managing user alerts.
servers:
  - url: http://service-notification:3008/api/v1/notifications
paths:
  /:
    get:
      summary: Retrieve all notifications for authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [EMAIL, SMS, PUSH]
        - name: category
          in: query
          schema:
            type: string
            enum: [LOGIN, TRANSFER, LOAN, CARD, SECURITY, SYSTEM, PROMOTION]
        - name: read
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of notifications.
  /read:
    put:
      summary: Mark notifications as read
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notificationIds
              properties:
                notificationIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Notifications marked read.
  /{id}:
    delete:
      summary: Delete notification
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification deleted.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
